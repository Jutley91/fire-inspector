<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FireInspect AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F0F2F6; min-height: 100vh; }
  .topbar { background: #1B2B4B; padding: 16px; text-align: center; }
  .logo { color: white; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: #E74C3C; }
  .tagline { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }
  .content { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
  h2 { font-size: 16px; color: #1B2B4B; margin-bottom: 16px; font-weight: 600; }
  .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #6B7A99; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 10px 12px; border: 1.5px solid #DDE2EE; border-radius: 8px; font-size: 15px; color: #1B2B4B; }
  input:focus { outline: none; border-color: #1B2B4B; }
  .btn-start { width: 100%; padding: 16px; background: #C0392B; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  .btn-resume { width: 100%; padding: 14px; background: #1B2B4B; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: block; text-align: center; text-decoration: none; }
  .resume-info { font-size: 12px; color: #6B7A99; margin-top: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Fire<span>Inspect</span> AI</div>
  <div class="tagline">Photo → NFPA Report in minutes</div>
</div>

<div class="content">

  {% if inspection %}
  <div class="card">
    <h2>Resume inspection</h2>
    <a class="btn-resume" href="/capture">Continue: {{ inspection.building_name }}</a>
    <div class="resume-info">{{ item_count }} items captured · {{ inspection.inspection_date }}</div>
  </div>
  {% endif %}

  <div class="card">
    <h2>New inspection</h2>
    <form action="/inspection/new" method="post">
      <label>Building name</label>
      <input type="text" name="building_name" placeholder="Acme Office Building" required>

      <label>Address</label>
      <input type="text" name="building_address" placeholder="123 Main St, City, ST">

      <label>Your name</label>
      <input type="text" name="inspector_name" placeholder="Inspector name">

      <label>Inspection date</label>
      <input type="date" name="inspection_date" value="{{ today }}">

      <button class="btn-start" type="submit">Start Inspection →</button>
    </form>
  </div>

</div>
</body>
</html>
